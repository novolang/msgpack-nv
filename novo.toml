[package]
name        = "msgpack-nv"
version     = "0.1.0"
description = "MessagePack, whole: every format family including bin, ext and the timestamp extension, a value tree, an encoder into a caller's buffer, a feed-and-drain decoder for a stream that arrives in pieces, and a serde bridge so a struct writes itself."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`: arithmetic over bytes the caller already holds.  No function
# declares an effect — a wire format has nowhere to put one, and the
# timestamp extension takes its seconds as a parameter because a `core`
# package has no clock.
#
# It carries no `tests/embedded_probe.nv` and makes no device claim: the surface speaks `Bytes`, `Str` and `Result`, and
# none of the three links at `@tier(embedded)` today.  cbor-nv is the
# one of this pair with a device half, because the plan row says the
# embedded tier prefers CBOR.
layer       = "core"

category    = "encoding"

tags        = ["msgpack", "messagepack", "serde", "wire-format", "streaming", "sans-io"]
repository  = "https://github.com/novolang/msgpack-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.13.0"

[docs.pages]
"README.md" = "JSON's data model in a quarter of the bytes"

[dependencies]
# None, and two of them are worth saying out loud.
#
# Not leb128-nv or zigzag-nv.  MessagePack's integers are big-endian
# and fixed width — one, two, four or eight bytes chosen by the format byte
# in front of them — and not variable-length quantities at all.  The
# two varint packages are postcard-nv's dependencies for a reason that
# does not apply here.
#
# Not serde-nv.  The `Serializer` and `Deserializer` traits this
# package implements are the standard library's (`std.serialize`), not
# that package's, and depending on it would put a second MessagePack
# implementation in every consumer's assembly.
